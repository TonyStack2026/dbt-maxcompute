version: 2

seeds:
  - name: orders
    description: >
      Tiny synthetic orders dataset used by every model in the showcase.
      Columns are explicitly typed so downstream `partition_by` examples
      reference the right MaxCompute types (string, bigint, decimal,
      datetime).
    config:
      column_types:
        order_id: bigint
        customer_id: bigint
        country: string
        amount: decimal(18, 2)
        status: string
        order_ts: datetime
    columns:
      - name: order_id
        description: Surrogate key.
        tests: [unique, not_null]
      - name: country
        description: ISO-2 country code, used as a static partition column.
      - name: order_ts
        description: Order timestamp, used as the source for date partitions
          and the microbatch event_time.

  - name: risk_events
    description: Nested JSON risk events used by both Python UDF and MaxFrame dependency tests.
    config:
      column_types:
        event_id: string
        customer_id: string
        event_json: string
        phone: string
        event_time: string
        default_region: string
        ds: string
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: event_json
        tests: [not_null]
      - name: ds
        tests: [not_null]

  - name: risk_customers
    description: Customer dimension used for joins and identity-similarity scoring.
    config:
      column_types:
        customer_id: string
        customer_name: string
        email: string
        phone: string
        tier: string
        country_code: string
        signup_at: string
        credit_limit: bigint
    columns:
      - name: customer_id
        tests: [unique, not_null]

  - name: device_reputation
    description: Device risk dimension with missing and extreme scores.
    config:
      column_types:
        device_id: string
        reputation_score: bigint
        is_tor: boolean
        last_seen_at: string
    columns:
      - name: device_id
        tests: [unique, not_null]
